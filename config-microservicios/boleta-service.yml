spring:
  application:
    name: boleta-service
  datasource:
    url: ${BOLETA_DB_URL:jdbc:mysql://localhost:3306/bd_boletas}
    username: ${BOLETA_DB_USERNAME:root}
    password: ${BOLETA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
